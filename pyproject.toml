[project]
name = "axis3-stac-extensions"
version = "0.1.0"
description = "JSON Schema and compatibility tests for the axis3hub STAC extension"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.25.1",
]

[dependency-groups]
dev = [
    "pystac[validation]==1.13.0",
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
